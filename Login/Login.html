<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - TemuTrip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="Login.css" />
</head>

<body>

  <div class="container">
    <div class="login-box">

      <div class="header-content" id="mainHeader">
        <div class="logo">
          <img src="Gambar/temutrip_logo.svg" alt="Logo" class="logo-icon">
          <span class="logo-text">TemuTrip</span>
        </div>
        <h1>Selamat Datang</h1>
        <p class="subtitle">Masuk untuk melanjutkan petualanganmu</p>
      </div>

      <form action="login.php" method="POST" class="form-container" id="signin">
        <div class="form-group">
          <label>Username atau Email</label>
          <input type="text" name="user_id" class="input-field" placeholder="Masukkan username atau email" required />
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" name="password" class="input-field" placeholder="Masukkan password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword(this)" tabindex="-1">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.441.0/icons/eye.svg" class="eye-icon" />
            </button>
          </div>
        </div>
        
        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" name="remember"> Ingat Saya
            </label>
            <a href="#" class="forgot-link" onclick="showForgot(event)">Lupa Password?</a>
        </div>

        <button type="submit" name="login" class="btn-primary">Sign In</button>
      </form>

      <form action="reset_password.php" method="POST" class="form-container hidden" id="forgot">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 5px;">Reset Password</h2>
        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">Masukkan email terdaftar untuk membuat password baru.</p>

        <div class="form-group">
            <label>Alamat Email Terdaftar</label>
            <input type="email" name="email" class="input-field" placeholder="contoh@gmail.com" required />
        </div>
        <div class="form-group">
            <label>Password Baru</label>
            <div class="input-wrapper">
                <input type="password" name="new_password" class="input-field" placeholder="Minimal 8 karakter (kombinasi)" required />
                <button type="button" class="toggle-pw" onclick="togglePassword(this)" tabindex="-1">
                    <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.441.0/icons/eye.svg" class="eye-icon" />
                </button>
            </div>
        </div>
        <div class="form-group">
            <label>Konfirmasi Password Baru</label>
            <div class="input-wrapper">
                <input type="password" name="confirm_password" class="input-field" placeholder="Ulangi password baru" required />
                <button type="button" class="toggle-pw" onclick="togglePassword(this)" tabindex="-1">
                    <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.441.0/icons/eye.svg" class="eye-icon" />
                </button>
            </div>
        </div>
        
        <button type="submit" name="reset" class="btn-primary">Reset Password</button>
        <a href="#" class="back-to-login" onclick="hideForgot(event)">Kembali ke Login</a>
      </form>

      <div class="auth-footer" id="authFooter" style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b;">
        Belum punya akun? <a href="register.html" style="color: #34715c; font-weight: 700; text-decoration: none;">Sign Up di sini</a>
      </div>

    </div>
  </div>

  <script src="Login.js"></script>
</body>

</html>
